---
name: Setup Python
description: Combination of Python setup actions

inputs:
  groups:
    description: Newline-separated list of dependency groups to install

runs:
  using: composite
  steps:
    - name: Setup Python install
      uses: actions/setup-python@v6
      with:
        python-version: '3.14'

    - name: Setup uv install
      uses: astral-sh/setup-uv@v8.2.0

    - name: Run uv sync (Windows)
      if: runner.os == 'Windows'
      env:
        INPUT_GROUPS: ${{ inputs.groups }}
      shell: pwsh
      run: |
        if (![string]::IsNullOrEmpty(${env:INPUT_GROUPS})) {
            $groupArgs = -split ${env:INPUT_GROUPS} -replace '^', '--group='
        }

        uv sync ${groupArgs}

    - name: Run uv sync (non-Windows)
      if: runner.os != 'Windows'
      env:
        INPUT_GROUPS: ${{ inputs.groups }}
      shell: bash
      run: |
        extra_args=()

        if [ -n "${INPUT_GROUPS}" ]; then
            while IFS= read -r group; do
                if [ -n "${group}" ]; then
                    extra_args+=("--group=${group}")
                fi
            done <<<"${INPUT_GROUPS}"
        fi

        uv sync "${extra_args[@]}"
        
    - name: Enable venv (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        .venv/Scripts/enable

    - name: Enable venv (non-Windows)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        source ./.venv/bin/activate