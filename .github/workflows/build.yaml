name: Build

on:
  release:
    types: created

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build on ${{ matrix.os-label }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - id: linux-x86
            os: ubuntu-22.04
            os-label: Linux x86
          - id: macos-arm
            os: macos-15
            os-label: macOS ARM
          - id: windows-x86
            os: windows-2022
            os-label: Windows x86

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: ./.github/actions/setup-python
        with:
          groups: build

      - name: Verify build runtime
        run: |
          uv run --no-managed-python python - <<'PY'
          import sys
          import _tkinter

          print("Python:", sys.version)
          print("Python executable:", sys.executable)
          print("Tcl:", _tkinter.TCL_VERSION)
          print("Tk:", _tkinter.TK_VERSION)

          assert sys.version_info[:3] == (3, 14, 5), sys.version
          assert _tkinter.TCL_VERSION in ("8.6", "9.0")
          assert _tkinter.TK_VERSION in ("8.6", "9.0")
          PY

      - name: Build executable (Linux)
        if: runner.os == 'Linux'
        run: |
          uv run --no-managed-python pyinstaller \
            --distpath dist/default \
            --workpath build/default \
            scripts/build.spec

          uv run --no-managed-python pyinstaller \
            --distpath dist/portable \
            --workpath build/portable \
            scripts/build.spec -- --portable

      - name: Build executable (macOS)
        if: runner.os == 'macOS'
        run: |
          uv run --no-managed-python pyinstaller scripts/build.spec

      - name: Build executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          uv run --no-managed-python PyInstaller `
            --distpath dist/default `
            --workpath build/default `
            scripts/build.spec

          uv run --no-managed-python PyInstaller `
            --distpath dist/portable `
            --workpath build/portable `
            scripts/build.spec -- --portable

      - name: Upload default executable
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.id }}-default
          path: |
            dist/default
            dist
          if-no-files-found: error
          archive: false

      - name: Upload portable executable
        if: runner.os != 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.id }}-portable
          path: |
            dist/portable
          if-no-files-found: error
          archive: false

  test:
    name: Test Windows executables
    needs: build
    runs-on: windows-2022

    steps:
      - name: Download default executable
        uses: actions/download-artifact@v8
        with:
          name: build-windows-x86-default
          path: ${{ runner.temp }}/build/default

      - name: Download portable executable
        uses: actions/download-artifact@v8
        with:
          name: build-windows-x86-portable
          path: ${{ runner.temp }}/build/portable

      - name: Test default executable
        shell: pwsh
        run: |
          .\tests\test-windows-exe.ps1 `
            -ExecutablePath "${env:RUNNER_TEMP}\build\default\personal-chemical-database\personal-chemical-database.exe"

      - name: Test portable executable
        shell: pwsh
        run: |
          .\tests\test-windows-exe.ps1 `
            -ExecutablePath "${env:RUNNER_TEMP}\build\portable\personal-chemical-database.exe"

  compress:
    name: Compress ${{ matrix.os-label }} executables
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - id: linux-x86
            os: ubuntu-22.04
            os-label: Linux x86
          - id: macos-arm
            os: macos-15
            os-label: macOS ARM
          - id: windows-x86
            os: windows-2022
            os-label: Windows x86

    env:
      BUILD_PREFIX: personal-chemical-database_${{ github.event.release.tag_name }}

    steps:
      - name: Download default executable
        uses: actions/download-artifact@v8
        with:
          name: build-${{ matrix.id }}-default
          path: ${{ runner.temp }}/build/default

      - name: Download portable executable
        if: matrix.id != 'macos-arm'
        uses: actions/download-artifact@v8
        with:
          name: build-${{ matrix.id }}-portable
          path: ${{ runner.temp }}/build/portable

      - name: Set archive paths (Linux/macOS)
        id: paths-unix
        if: runner.os != 'Windows'
        run: |
          os=$(printf '%s' "${RUNNER_OS}" | tr '[:upper:]' '[:lower:]')
          arch=$(uname -m)
          dir="${RUNNER_TEMP}/upload"
          mkdir -p "${dir}"

          common="${dir}/${BUILD_PREFIX}_${os}_${arch}"

          echo "default=${common}.tar.gz" >> "${GITHUB_OUTPUT}"

          if [ "${RUNNER_OS}" = "Linux" ]; then
            echo "portable=${common}_portable.tar.gz" >> "${GITHUB_OUTPUT}"
          fi

      - name: Set archive paths (Windows)
        id: paths-windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "${env:RUNNER_TEMP}/upload"
          New-Item -Path $dir -ItemType Directory -Force | Out-Null

          $arch = (uname -m)
          $common = "${dir}/${env:BUILD_PREFIX}_windows_${arch}"

          "default=${common}.zip" >> ${env:GITHUB_OUTPUT}
          "portable=${common}_portable.zip" >> ${env:GITHUB_OUTPUT}

      - name: Compress archives (Linux)
        if: runner.os == 'Linux'
        run: |
          tar czf "${{ steps.paths-unix.outputs.default }}" `
            -C "${RUNNER_TEMP}/build/default/personal-chemical-database" .

          tar czf "${{ steps.paths-unix.outputs.portable }}" `
            -C "${RUNNER_TEMP}/build/portable" personal-chemical-database

      - name: Compress archive (macOS)
        if: runner.os == 'macOS'
        run: |
          tar czf "${{ steps.paths-unix.outputs.default }}" `
            -C "${RUNNER_TEMP}/build/default" Personal-Chemical-Database.app

      - name: Compress archives (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "${env:RUNNER_TEMP}\build\default\personal-chemical-database" `
            -DestinationPath "${{ steps.paths-windows.outputs.default }}"

          Compress-Archive `
            -Path "${env:RUNNER_TEMP}\build\portable\personal-chemical-database.exe" `
            -DestinationPath "${{ steps.paths-windows.outputs.portable }}"

      - name: Upload default archive
        uses: actions/upload-artifact@v7
        with:
          name: archive-${{ matrix.id }}-default
          path: ${{ runner.os == 'Windows' && steps.paths-windows.outputs.default || steps.paths-unix.outputs.default }}
          if-no-files-found: error
          archive: false

      - name: Upload portable archive
        if: matrix.id != 'macos-arm'
        uses: actions/upload-artifact@v7
        with:
          name: archive-${{ matrix.id }}-portable
          path: ${{ runner.os == 'Windows' && steps.paths-windows.outputs.portable || steps.paths-unix.outputs.portable }}
          if-no-files-found: error
          archive: false

  upload:
    name: Upload archives to release
    needs: compress
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download compressed archives
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/download
          merge-multiple: true

      - name: Upload archives to release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ runner.temp }}/download/*
